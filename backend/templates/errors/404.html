{% extends 'base.html' %}
{% load static %}

{% block title %}Ошибка 404 - Страница не найдена | Clinic Sirius{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center">
      <div class="mb-4">
        <i class="bi bi-file-earmark-x-fill text-primary" style="font-size: 5rem;"></i>
      </div>
      <h1 class="display-4 fw-bold mb-3">404</h1>
      <h2 class="h4 mb-4">Страница не найдена</h2>
      <p class="text-muted mb-4">
        Запрашиваемая страница не существует или была перемещена. Проверьте правильность адреса.
      </p>
      <div class="d-flex gap-3 justify-content-center">
        <a href="{% url 'index' %}" class="btn btn-primary">
          <i class="bi bi-house-fill me-2"></i>На главную
        </a>
        <button onclick="history.back()" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-2"></i>Назад
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
